# --- Database ---
# Update these to match your local Postgres setup.
spring.datasource.url=jdbc:postgresql://localhost:5432/saas_pm
spring.datasource.username=postgres
spring.datasource.password=postgres

# Auto-creates/updates tables from your entities on startup.
# Fine for development. In production you'd use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Server ---
server.port=8080
